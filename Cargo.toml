[workspace]
members = [
  "crates/sarakura-core",
  "crates/sarakura-gb",
  "crates/sarakura-fc",
  "crates/sarakura-report",
  "crates/sarakura-schema",
  "crates/sarakura-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "1.0.0"
license = "MIT"
authors = ["KITAQ Project"]
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"
pretty_assertions = "1"
